<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Province</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <button id="menuBtn" aria-label="Menu" aria-expanded="false"><i></i><i></i><i></i></button>
  <div class="pl" id="pl1"></div>

  <div id="boardWrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div class="pl" id="pl0"></div>

  <section id="dock">
    <div id="msg"></div>
    <div id="controls"></div>
  </section>

  <nav id="bar">
    <button id="tutBtn" class="link">Tutorial</button>
    <button id="undoBtn" class="link">Undo</button>
    <button id="logBtn" class="link">Log</button>
    <button id="newBtn" class="link">Lobby</button>
  </nav>
  <div id="logBox" hidden></div>
</div>

<aside id="coach" hidden>
  <div class="coach-top"><span id="coachStep"></span><span class="coach-actions"><span id="coachFoot"></span><button id="coachExit" class="link" type="button">Exit</button></span></div>
  <h3 id="coachTitle"></h3>
  <div id="coachBody"></div>
  <div id="coachNudge"></div>
</aside>

<div id="newModal" class="overlay" hidden>
  <div class="modal">
    <h2>Vs computer</h2>
    <div id="grpBoardWrap">
      <div class="lbl">Board</div>
      <div class="seg" id="grpBoard"><button data-v="6">6×6</button><button data-v="8">8×8</button></div>
    </div>
    <div id="grpSideWrap">
      <div class="lbl">I play</div>
      <div class="seg" id="grpSide"><button data-v="0">Green · first</button><button data-v="1">Blue</button></div>
    </div>
    <div id="grpLevelWrap">
      <div class="lbl">Computer</div>
      <div class="seg" id="grpLevel"><button data-v="easy">Easy</button><button data-v="strong">Strong</button></div>
    </div>
    <div class="modal-actions">
      <button id="newCancel" class="btn ghost">Cancel</button>
      <button id="newStart" class="btn">Start</button>
    </div>
  </div>
</div>

<div id="lobby" class="screen" hidden>
  <div class="lobby-in">
    <div class="lb-online" title="Players online"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.8c1.8.7 3 2.4 3 5.2"/></svg><span id="lbCount">–</span></div>
    <div id="lbList" class="lb-list"></div>
    <div id="lbMsg"></div>
    <button id="lbPlus" class="lb-plus" type="button" aria-label="New game">+</button>
  </div>
</div>

<div id="startModal" class="overlay" hidden>
  <div class="modal">
    <h2>Play</h2>
    <div>
      <div class="lbl">Online game</div>
      <div class="seg" id="lbBoard"><button data-v="6" class="on">6×6</button><button data-v="8">8×8</button></div>
    </div>
    <button id="lbCreate" class="btn">Create online game</button>
    <button id="lbAi" class="btn soft">Vs computer</button>
    <button id="lbCont" class="btn soft" hidden>Continue game</button>
    <button id="lbTut" class="link" type="button">Tutorial</button>
    <button id="startCancel" class="link" type="button">Close</button>
  </div>
</div>

<div id="nameModal" class="overlay" hidden>
  <div class="modal">
    <h2>Your name</h2>
    <input id="nameIn" maxlength="20" placeholder="Name" autocomplete="off" spellcheck="false">
    <div class="modal-actions">
      <button id="nameCancel" class="btn ghost">Cancel</button>
      <button id="nameOk" class="btn">OK</button>
    </div>
  </div>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="modal">
    <h2 id="winTitle"></h2>
    <div id="winText" hidden></div>
    <div class="modal-actions">
      <button id="winClose" class="btn ghost">View board</button>
      <button id="winNew" class="btn">New game</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="src/rules.js"></script>
<script src="src/ai.js"></script>
<script src="src/tutorial.js"></script>
<script src="src/online.js"></script>
<script src="src/app.js"></script>
</body>
</html>
