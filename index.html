<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1d12">
<title>Province</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="panel" id="panel1"></div>
    <div class="panel" id="panel0"></div>
  </div>

  <div id="boardWrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div id="dock">
    <div id="dice"></div>
    <div id="msg"></div>
    <div id="controls"></div>
  </div>

  <div id="bar">
    <button id="undoBtn" class="ghost">↶ בטל מהלך</button>
    <button id="logBtn" class="ghost">יומן</button>
    <button id="newBtn" class="ghost">משחק חדש</button>
  </div>
  <div id="logBox" hidden></div>
</div>

<div id="newModal" hidden>
  <div class="modal">
    <h2>משחק חדש</h2>
    <div class="grp" id="grpMode">
      <button data-v="pvp">שני שחקנים על המכשיר</button>
      <button data-v="ai">נגד המחשב</button>
    </div>
    <div id="grpSideWrap"><div class="lbl">אני משחק</div>
      <div class="grp" id="grpSide">
        <button data-v="0">אדום (מתחיל)</button>
        <button data-v="1">כחול</button>
      </div>
    </div>
    <div id="grpLevelWrap"><div class="lbl">רמת המחשב</div>
      <div class="grp" id="grpLevel">
        <button data-v="easy">קל</button>
        <button data-v="strong">חזק</button>
      </div>
    </div>
    <button id="newStart" class="primary">התחל</button>
    <button id="newCancel" class="ghost">ביטול</button>
  </div>
</div>

<div id="overlay" hidden>
  <div class="modal">
    <h2 id="winTitle"></h2>
    <button id="winNew" class="primary">משחק חדש</button>
    <button id="winClose" class="ghost">הצג את הלוח</button>
  </div>
</div>

<script src="src/rules.js"></script>
<script src="src/ai.js"></script>
<script src="src/app.js"></script>
</body>
</html>
