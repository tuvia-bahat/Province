<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Province</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <button id="menuBtn" aria-label="Menu" aria-expanded="false"><i></i><i></i><i></i></button>
  <div class="pl" id="pl1"></div>

  <div id="boardWrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div class="pl" id="pl0"></div>

  <section id="dock">
    <div id="dice"></div>
    <div id="msg"></div>
    <div id="controls"></div>
  </section>

  <nav id="bar">
    <button id="tutBtn" class="link">Tutorial</button>
    <button id="undoBtn" class="link">Undo</button>
    <button id="speedBtn" class="link" hidden>Speed</button>
    <button id="logBtn" class="link">Log</button>
    <button id="newBtn" class="link">New game</button>
  </nav>
  <div id="logBox" hidden></div>
</div>

<aside id="coach" hidden>
  <div class="coach-top"><span id="coachStep"></span><span class="coach-actions"><span id="coachFoot"></span><button id="coachExit" class="link" type="button">Exit</button></span></div>
  <h3 id="coachTitle"></h3>
  <div id="coachBody"></div>
  <div id="coachNudge"></div>
</aside>

<div id="newModal" class="overlay" hidden>
  <div class="modal">
    <h2>New game</h2>
    <div class="seg" id="grpMode">
      <button data-v="pvp">2 players</button>
      <button data-v="ai">Vs computer</button>
      <button data-v="watch">Watch</button>
    </div>
    <div id="grpBoardWrap">
      <div class="lbl">Board</div>
      <div class="seg" id="grpBoard"><button data-v="6">6×6</button><button data-v="8">8×8</button></div>
    </div>
    <div id="grpSideWrap">
      <div class="lbl">I play</div>
      <div class="seg" id="grpSide"><button data-v="0">Red · first</button><button data-v="1">Blue</button></div>
    </div>
    <div id="grpLevelWrap">
      <div class="lbl">Computer</div>
      <div class="seg" id="grpLevel"><button data-v="easy">Easy</button><button data-v="strong">Strong</button></div>
    </div>
    <div id="grpWatchWrap">
      <div class="lbl">Red</div>
      <div class="seg" id="grpLevelR"><button data-v="easy">Easy</button><button data-v="strong">Strong</button></div>
      <div class="lbl">Blue</div>
      <div class="seg" id="grpLevelB"><button data-v="easy">Easy</button><button data-v="strong">Strong</button></div>
      <div class="lbl">Speed</div>
      <div class="seg" id="grpSpeed"><button data-v="slow">Slow</button><button data-v="normal">Normal</button><button data-v="fast">Fast</button></div>
    </div>
    <button id="tutLink" class="link" type="button">New here? Play the tutorial</button>
    <div class="modal-actions">
      <button id="newCancel" class="btn ghost">Cancel</button>
      <button id="newStart" class="btn">Start</button>
    </div>
  </div>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="modal">
    <h2 id="winTitle"></h2>
    <div id="winText" hidden></div>
    <div class="modal-actions">
      <button id="winClose" class="btn ghost">View board</button>
      <button id="winNew" class="btn">New game</button>
    </div>
  </div>
</div>

<script src="src/rules.js"></script>
<script src="src/ai.js"></script>
<script src="src/tutorial.js"></script>
<script src="src/app.js"></script>
</body>
</html>
