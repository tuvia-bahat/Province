<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Province">
<title>Province</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <button id="menuBtn" aria-label="Menu" aria-expanded="false"><i></i><i></i><i></i></button>
  <div class="pl" id="pl1"></div>

  <div id="boardWrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div class="pl" id="pl0"></div>

  <section id="dock">
    <div id="msg"></div>
    <div id="controls"></div>
  </section>

  <nav id="bar">
    <button id="tutBtn" class="link">Tutorial</button>
    <button id="undoBtn" class="link">Undo</button>
    <button id="logBtn" class="link">Log</button>
    <button id="newBtn" class="link">Lobby</button>
  </nav>
  <div id="logBox" hidden></div>
</div>

<aside id="coach" hidden>
  <div class="coach-top"><span id="coachStep"></span><span class="coach-actions"><span id="coachFoot"></span><button id="coachExit" class="link" type="button">Exit</button></span></div>
  <h3 id="coachTitle"></h3>
  <div id="coachBody"></div>
  <div id="coachNudge"></div>
</aside>

<div id="lobby" class="screen" hidden>
  <div class="lb-online" title="Players online"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.8c1.8.7 3 2.4 3 5.2"/></svg><span id="lbCount">–</span></div>
  <div class="lb-mid"><div id="lbList" class="lb-list"></div><div id="lbMsg"></div></div>
  <div id="lbInstall" class="lb-install" hidden><span id="lbInstallTxt">Add Province to your home screen</span><button id="lbInstallBtn" class="btn sm" type="button">Install</button><button id="lbInstallX" class="lb-x" type="button" aria-label="Dismiss">×</button></div>
  <button id="lbPlus" class="lb-plus" type="button" aria-label="New game"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div id="startModal" class="overlay" hidden>
  <div class="modal">
    <div id="startMain" class="stack">
      <button id="lbOnline" class="tile pri"><i class="ti"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 4 5.7 4 9s-1.4 6.3-4 9c-2.6-2.7-4-5.7-4-9s1.4-6.3 4-9z"/></svg></i>Online</button>
      <button id="lbAi" class="tile"><i class="ti"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2.5"/><path d="M8 20h8M12 16v4"/></svg></i>Vs computer</button>
      <button id="lbCont" class="tile" hidden><i class="ti"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.5v13l10.5-6.5z"/></svg></i>Continue</button>
      <button id="lbTut" class="tile"><i class="ti"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9L12 4.5 21.5 9 12 13.5z"/><path d="M6 11.2V16c0 1.4 2.7 2.8 6 2.8s6-1.4 6-2.8v-4.8"/></svg></i>Tutorial</button>
    </div>
    <div id="startSize" hidden>
      <div class="tiles2">
        <button class="tile sz" data-size="6"><svg viewBox="0 0 32 32" width="34" height="34" fill="currentColor"><circle cx="2.00" cy="2.00" r="1.5"/><circle cx="2.00" cy="7.60" r="1.5"/><circle cx="2.00" cy="13.20" r="1.5"/><circle cx="2.00" cy="18.80" r="1.5"/><circle cx="2.00" cy="24.40" r="1.5"/><circle cx="2.00" cy="30.00" r="1.5"/><circle cx="7.60" cy="2.00" r="1.5"/><circle cx="7.60" cy="7.60" r="1.5"/><circle cx="7.60" cy="13.20" r="1.5"/><circle cx="7.60" cy="18.80" r="1.5"/><circle cx="7.60" cy="24.40" r="1.5"/><circle cx="7.60" cy="30.00" r="1.5"/><circle cx="13.20" cy="2.00" r="1.5"/><circle cx="13.20" cy="7.60" r="1.5"/><circle cx="13.20" cy="13.20" r="1.5"/><circle cx="13.20" cy="18.80" r="1.5"/><circle cx="13.20" cy="24.40" r="1.5"/><circle cx="13.20" cy="30.00" r="1.5"/><circle cx="18.80" cy="2.00" r="1.5"/><circle cx="18.80" cy="7.60" r="1.5"/><circle cx="18.80" cy="13.20" r="1.5"/><circle cx="18.80" cy="18.80" r="1.5"/><circle cx="18.80" cy="24.40" r="1.5"/><circle cx="18.80" cy="30.00" r="1.5"/><circle cx="24.40" cy="2.00" r="1.5"/><circle cx="24.40" cy="7.60" r="1.5"/><circle cx="24.40" cy="13.20" r="1.5"/><circle cx="24.40" cy="18.80" r="1.5"/><circle cx="24.40" cy="24.40" r="1.5"/><circle cx="24.40" cy="30.00" r="1.5"/><circle cx="30.00" cy="2.00" r="1.5"/><circle cx="30.00" cy="7.60" r="1.5"/><circle cx="30.00" cy="13.20" r="1.5"/><circle cx="30.00" cy="18.80" r="1.5"/><circle cx="30.00" cy="24.40" r="1.5"/><circle cx="30.00" cy="30.00" r="1.5"/></svg>6×6</button>
        <button class="tile sz" data-size="8"><svg viewBox="0 0 32 32" width="34" height="34" fill="currentColor"><circle cx="2.00" cy="2.00" r="1.5"/><circle cx="2.00" cy="6.00" r="1.5"/><circle cx="2.00" cy="10.00" r="1.5"/><circle cx="2.00" cy="14.00" r="1.5"/><circle cx="2.00" cy="18.00" r="1.5"/><circle cx="2.00" cy="22.00" r="1.5"/><circle cx="2.00" cy="26.00" r="1.5"/><circle cx="2.00" cy="30.00" r="1.5"/><circle cx="6.00" cy="2.00" r="1.5"/><circle cx="6.00" cy="6.00" r="1.5"/><circle cx="6.00" cy="10.00" r="1.5"/><circle cx="6.00" cy="14.00" r="1.5"/><circle cx="6.00" cy="18.00" r="1.5"/><circle cx="6.00" cy="22.00" r="1.5"/><circle cx="6.00" cy="26.00" r="1.5"/><circle cx="6.00" cy="30.00" r="1.5"/><circle cx="10.00" cy="2.00" r="1.5"/><circle cx="10.00" cy="6.00" r="1.5"/><circle cx="10.00" cy="10.00" r="1.5"/><circle cx="10.00" cy="14.00" r="1.5"/><circle cx="10.00" cy="18.00" r="1.5"/><circle cx="10.00" cy="22.00" r="1.5"/><circle cx="10.00" cy="26.00" r="1.5"/><circle cx="10.00" cy="30.00" r="1.5"/><circle cx="14.00" cy="2.00" r="1.5"/><circle cx="14.00" cy="6.00" r="1.5"/><circle cx="14.00" cy="10.00" r="1.5"/><circle cx="14.00" cy="14.00" r="1.5"/><circle cx="14.00" cy="18.00" r="1.5"/><circle cx="14.00" cy="22.00" r="1.5"/><circle cx="14.00" cy="26.00" r="1.5"/><circle cx="14.00" cy="30.00" r="1.5"/><circle cx="18.00" cy="2.00" r="1.5"/><circle cx="18.00" cy="6.00" r="1.5"/><circle cx="18.00" cy="10.00" r="1.5"/><circle cx="18.00" cy="14.00" r="1.5"/><circle cx="18.00" cy="18.00" r="1.5"/><circle cx="18.00" cy="22.00" r="1.5"/><circle cx="18.00" cy="26.00" r="1.5"/><circle cx="18.00" cy="30.00" r="1.5"/><circle cx="22.00" cy="2.00" r="1.5"/><circle cx="22.00" cy="6.00" r="1.5"/><circle cx="22.00" cy="10.00" r="1.5"/><circle cx="22.00" cy="14.00" r="1.5"/><circle cx="22.00" cy="18.00" r="1.5"/><circle cx="22.00" cy="22.00" r="1.5"/><circle cx="22.00" cy="26.00" r="1.5"/><circle cx="22.00" cy="30.00" r="1.5"/><circle cx="26.00" cy="2.00" r="1.5"/><circle cx="26.00" cy="6.00" r="1.5"/><circle cx="26.00" cy="10.00" r="1.5"/><circle cx="26.00" cy="14.00" r="1.5"/><circle cx="26.00" cy="18.00" r="1.5"/><circle cx="26.00" cy="22.00" r="1.5"/><circle cx="26.00" cy="26.00" r="1.5"/><circle cx="26.00" cy="30.00" r="1.5"/><circle cx="30.00" cy="2.00" r="1.5"/><circle cx="30.00" cy="6.00" r="1.5"/><circle cx="30.00" cy="10.00" r="1.5"/><circle cx="30.00" cy="14.00" r="1.5"/><circle cx="30.00" cy="18.00" r="1.5"/><circle cx="30.00" cy="22.00" r="1.5"/><circle cx="30.00" cy="26.00" r="1.5"/><circle cx="30.00" cy="30.00" r="1.5"/></svg>8×8</button>
      </div>
      <button id="startBack" class="link" type="button">Back</button>
    </div>
  </div>
</div>

<div id="nameModal" class="overlay" hidden>
  <div class="modal">
    <h2>Your name</h2>
    <input id="nameIn" maxlength="20" placeholder="Name" autocomplete="off" spellcheck="false">
    <div class="modal-actions">
      <button id="nameCancel" class="btn ghost">Cancel</button>
      <button id="nameOk" class="btn">OK</button>
    </div>
  </div>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="modal">
    <h2 id="winTitle"></h2>
    <div id="winText" hidden></div>
    <div class="modal-actions">
      <button id="winClose" class="btn ghost">View board</button>
      <button id="winNew" class="btn">New game</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="src/rules.js"></script>
<script src="src/ai.js"></script>
<script src="src/tutorial.js"></script>
<script src="src/online.js"></script>
<script src="src/app.js"></script>
</body>
</html>
